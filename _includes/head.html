<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/css/override.css" | relative_url }}">
  {%- feed_meta -%}
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCFRB03XP2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DCFRB03XP2');
  </script>

  <!-- highlight.js support -->
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/github.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/ssms.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/xpp.css" | relative_url }}">

  <script defer src="{{ "/js/highlightjs/highlight.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/plaintext.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/powershell.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/tsql.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/csharp.min.js" | relative_url }}"></script>
  <!-- xpp.min.js must load after highlight.min.js so it replaces the bundled X++ stub.
       "axapta" and "x++" remain aliases of "xpp". -->
  <script defer src="{{ "/js/highlightjs/languages/xpp.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/javascript.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlightjs/languages/dos.min.js" | relative_url }}"></script>
  <script defer src="{{ "/js/highlight-init.js" | relative_url }}"></script>
  <script defer src="{{ "/js/copy-code-button.js" | relative_url }}"></script>
  <!-- end highlight.js support -->

  <script src="//unpkg.com/darkreader@4.9.40/darkreader.js"></script>
  <script type="text/javascript">
    DarkReader.setFetchMethod(window.fetch);
    DarkReader.auto({
        brightness: 100,
        contrast: 90,
        sepia: 10
    });
  </script>
</head>
